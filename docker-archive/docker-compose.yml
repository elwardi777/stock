version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: dfl-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dfl_fresh

  backend:
    build: ./backend
    container_name: dfl-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: dfl_fresh
      SECRET_KEY: super-secret-key-change-in-production-32chars
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: dfl-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
  upload_data:

